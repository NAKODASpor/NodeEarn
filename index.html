<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NodeEarn - Platform Penghasilan Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .btn-gradient { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); transition: all 0.3s ease; }
        .btn-gradient:hover { transform: translateY(-2px); shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4); }
        .modal-active { overflow: hidden; }
        .hidden-form { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <nav class="fixed w-full z-50 glass-nav">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center h-20">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 w-10 h-10 rounded-xl flex items-center justify-center text-white shadow-lg"><i class="fas fa-cube text-xl"></i></div>
                <span class="text-2xl font-bold tracking-tight">Node<span class="text-blue-600">Earn</span></span>
            </div>
            <button onclick="openModal('signup')" class="btn-gradient text-white px-6 py-2.5 rounded-full text-sm font-bold shadow-md">Mulai Gratis</button>
        </div>
    </nav>

    <header class="pt-48 pb-24 px-6 text-center">
        <h1 class="text-5xl lg:text-7xl font-extrabold text-slate-900 leading-tight mb-6">Ubah Waktu Jadi <span class="text-blue-600">Cuan.</span></h1>
        <p class="text-lg text-slate-500 mb-8 max-w-xl mx-auto">Cukup HP dan Kuota, selesaikan misi mudah dan kumpulkan saldo rupiah setiap hari.</p>
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <button onclick="openModal('signup')" class="btn-gradient text-white px-8 py-4 rounded-2xl font-bold text-lg shadow-xl">Daftar Sekarang</button>
            <a href="https://tiktok.com" target="_blank" class="px-8 py-4 rounded-2xl font-bold text-lg text-slate-700 bg-white border border-slate-300 flex items-center justify-center gap-2 hover:bg-black hover:text-white transition">
                <i class="fab fa-tiktok"></i> Follow TikTok
            </a>
        </div>
    </header>

    <div id="modalBackdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[99] hidden opacity-0 transition-opacity duration-300" onclick="closeModal()"></div>
    
    <div id="authModal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl z-[100] hidden opacity-0 scale-95 transition-all duration-300 p-8 border border-slate-100">
        
        <div class="flex justify-between items-center mb-6">
            <h3 id="modalTitle" class="text-2xl font-extrabold text-slate-900">Daftar Akun</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-900"><i class="fas fa-times"></i></button>
        </div>

        <div id="step1">
            <form onsubmit="goToStep2(event)" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase ml-1 mb-1">Email</label>
                    <input type="email" required placeholder="nama@email.com" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase ml-1 mb-1">Password Baru</label>
                    <input type="password" required placeholder="••••••••" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition">
                </div>
                <button type="submit" class="w-full btn-gradient text-white py-4 rounded-2xl font-bold text-lg shadow-lg shadow-blue-500/20 mt-2">
                    Daftar & Kirim OTP
                </button>
            </form>
        </div>

        <div id="step2" class="hidden-form">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-shield-alt text-2xl text-blue-600"></i>
                </div>
                <p class="text-sm text-slate-500 leading-relaxed">Kami telah mengirimkan 6-digit kode OTP ke email Anda. Silakan masukkan di bawah:</p>
            </div>
            <form onsubmit="finishSignup(event)" class="space-y-6">
                <div class="flex justify-between gap-2">
                    <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button type="submit" class="w-full btn-gradient text-white py-4 rounded-2xl font-bold text-lg shadow-lg shadow-blue-500/20">
                    Verifikasi Sekarang
                </button>
                <p class="text-center text-xs text-slate-400">Tidak menerima kode? <a href="#" class="text-blue-600 font-bold">Kirim Ulang</a></p>
            </form>
        </div>

        <div id="googleSection">
            <div class="relative flex py-6 items-center">
                <div class="flex-grow border-t border-slate-100"></div>
                <span class="flex-shrink mx-4 text-slate-400 text-[10px] font-bold uppercase tracking-widest">Atau</span>
                <div class="flex-grow border-t border-slate-100"></div>
            </div>
            <button class="w-full flex items-center justify-center gap-3 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold py-4 rounded-2xl transition">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5">
                <span>Lanjutkan dengan Google</span>
            </button>
        </div>
    </div>

    <script>
        const modal = document.getElementById('authModal');
        const backdrop = document.getElementById('modalBackdrop');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const googleSection = document.getElementById('googleSection');

        function openModal(mode) {
            backdrop.classList.remove('hidden');
            modal.classList.remove('hidden');
            setTimeout(() => {
                backdrop.classList.add('opacity-100');
                modal.classList.add('opacity-100', 'scale-100');
            }, 10);
            document.body.classList.add('modal-active');
        }

        function closeModal() {
            modal.classList.remove('opacity-100', 'scale-100');
            backdrop.classList.remove('opacity-100');
            setTimeout(() => {
                modal.classList.add('hidden');
                backdrop.classList.add('hidden');
                // Reset to Step 1
                step1.style.display = 'block';
                step2.style.display = 'none';
                googleSection.style.display = 'block';
            }, 300);
            document.body.classList.remove('modal-active');
        }

        function goToStep2(e) {
            e.preventDefault();
            // Animasi transisi
            step1.style.display = 'none';
            googleSection.style.display = 'none';
            step2.style.display = 'block';
            document.getElementById('modalTitle').innerText = "Verifikasi Kode";
        }

        function finishSignup(e) {
            e.preventDefault();
            alert("Kode OTP sedang diverifikasi... (Backend sedang disiapkan)");
            // Kamu bisa arahkan ke dashboard.html di sini
        }

        // Auto focus input OTP
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('keyup', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
        });
    </script>
</body>
</html>
