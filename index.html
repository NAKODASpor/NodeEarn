<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Earn App - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-white font-sans">

    <nav class="p-5 flex justify-between items-center bg-[#1e293b] border-b border-gray-700">
        <h1 class="text-xl font-bold text-orange-400"><i class="fas fa-wallet mr-2"></i>EarnApp</h1>
        <div class="bg-gray-700 px-3 py-1 rounded-full text-sm">
            <i class="fas fa-user-circle mr-1"></i> User_123
        </div>
    </nav>

    <main class="p-6 max-w-md mx-auto">
        
        <div class="bg-gradient-to-br from-orange-500 to-yellow-500 p-6 rounded-3xl shadow-lg mb-8 text-gray-900">
            <p class="text-sm font-semibold opacity-80 uppercase tracking-wider">Total Saldo Anda</p>
            <h2 class="text-4xl font-black mt-1" id="balanceText">Rp 500.000</h2>
            <p class="text-xs mt-4 bg-black/10 w-fit px-2 py-1 rounded font-bold">+ Rp 12.500 hari ini</p>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <button onclick="claimReward()" class="bg-[#1e293b] p-4 rounded-2xl border border-gray-700 hover:border-orange-500 transition-all text-center">
                <i class="fas fa-gift text-2xl text-orange-400 mb-2"></i>
                <p class="text-xs font-medium">Daily Claim</p>
            </button>
            <button class="bg-[#1e293b] p-4 rounded-2xl border border-gray-700 hover:border-orange-500 transition-all text-center">
                <i class="fas fa-tasks text-2xl text-blue-400 mb-2"></i>
                <p class="text-xs font-medium">Misi Baru</p>
            </button>
        </div>

        <div class="bg-[#1e293b] rounded-3xl p-5 border border-gray-700">
            <h3 class="font-bold mb-4 flex justify-between items-center">
                Riwayat Terakhir
                <span class="text-xs text-gray-400 font-normal underline cursor-pointer">Lihat Semua</span>
            </h3>
            
            <div class="space-y-4">
                <div class="flex items-center justify-between border-b border-gray-700 pb-3">
                    <div class="flex items-center gap-3">
                        <div class="bg-green-500/20 p-2 rounded-lg text-green-500"><i class="fas fa-arrow-down text-sm"></i></div>
                        <div>
                            <p class="text-sm font-bold">Bonus Login</p>
                            <p class="text-[10px] text-gray-400">17 Feb 2026 - 19:30</p>
                        </div>
                    </div>
                    <p class="text-green-400 font-bold text-sm">+ Rp 2.500</p>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="bg-blue-500/20 p-2 rounded-lg text-blue-500"><i class="fas fa-check text-sm"></i></div>
                        <div>
                            <p class="text-sm font-bold">Misi Nonton Video</p>
                            <p class="text-[10px] text-gray-400">17 Feb 2026 - 18:45</p>
                        </div>
                    </div>
                    <p class="text-green-400 font-bold text-sm">+ Rp 10.000</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        let balance = 500000;
        function claimReward() {
            balance += 5000;
            document.getElementById('balanceText').innerText = "Rp " + balance.toLocaleString('id-ID');
            alert('Selamat! Bonus Rp 5.000 telah masuk ke saldo kamu.');
        }
    </script>
</body>
</html>
